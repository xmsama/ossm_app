name: ossm_app
description: "OSSM machine controller."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.13
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: OssmSans
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC.ttf
          weight: 700
  assets:
    - assets/fonts/OFL.txt
